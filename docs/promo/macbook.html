<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Infrastructure — MacBook</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { display: grid; place-items: center; width: 100vw; min-height: 100vh; overflow: hidden; }
    .macbook { width: 1600px; padding-top: 8px; filter: drop-shadow(0 21px 27px #0002); }
    .lid { position: relative; width: 1490px; height: 950px; margin: auto; padding: 14px 15px 16px; border: 10px solid #292929; border-radius: 18px 18px 5px 5px; background: #171717; }
    .camera { position: absolute; top: -4px; left: 50%; width: 5px; height: 5px; transform: translateX(-50%); border-radius: 50%; background: #555; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .base { position: relative; width: 1600px; height: 30px; margin-top: -1px; clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%); border-radius: 0 0 70px 70px; background: linear-gradient(#d4d4d2, #b8b8b7 67%, #9f9f9f); }
    .base::after { content: ""; position: absolute; top: 0; left: 50%; width: 180px; height: 4px; transform: translateX(-50%); border-radius: 0 0 8px 8px; background: #a5a5a4; }
    @media (max-width: 1700px) { .macbook { transform: scale(calc(100vw / 1700)); transform-origin: center; } }
  </style>
</head>
<body><main class="canvas"><div class="macbook" aria-label="Десктопный интерфейс EV Infrastructure в рамке MacBook"><div class="lid"><div class="camera" aria-hidden="true"></div><iframe title="Десктопный интерфейс EV Infrastructure" src="interface.html"></iframe></div><div class="base" aria-hidden="true"></div></div></main></body>
</html>
