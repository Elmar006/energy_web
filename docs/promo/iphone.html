<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Infrastructure — iPhone</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .canvas { display: grid; place-items: center; width: 100vw; height: 100vh; min-height: 870px; }
    .iphone { position: relative; width: 416px; height: 870px; padding: 5px; border: 8px solid #292929; border-radius: 58px; background: #292929; box-shadow: 0 24px 60px #0003, inset 0 0 0 1px #5c5c5c; }
    .screen { width: 100%; height: 100%; overflow: hidden; border-radius: 44px; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .island { position: absolute; z-index: 2; top: 14px; left: 50%; width: 118px; height: 25px; transform: translateX(-50%); border-radius: 99px; background: #171717; pointer-events: none; }
    .home-indicator { position: absolute; z-index: 2; bottom: 14px; left: 50%; width: 105px; height: 4px; transform: translateX(-50%); border-radius: 99px; background: #171717; pointer-events: none; }
    .button-left { position: absolute; top: 139px; left: -11px; width: 3px; height: 56px; border-radius: 2px 0 0 2px; background: #585858; }
    .button-right { position: absolute; top: 175px; right: -11px; width: 3px; height: 78px; border-radius: 0 2px 2px 0; background: #585858; }
    @media (max-width: 500px) { .canvas { min-height: 100dvh; transform: scale(min(1, calc(100vw / 440))); } }
  </style>
</head>
<body><main class="canvas"><div class="iphone" aria-label="Мобильный интерфейс EV Infrastructure в рамке iPhone"><div class="screen"><iframe title="Мобильный интерфейс EV Infrastructure" src="interface.html"></iframe></div><div class="island" aria-hidden="true"></div><div class="home-indicator" aria-hidden="true"></div><div class="button-left" aria-hidden="true"></div><div class="button-right" aria-hidden="true"></div></div></main></body>
</html>
