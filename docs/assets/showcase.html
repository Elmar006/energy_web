<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Энергоконтур — интерфейс</title>
  <style>
    :root { --paper: #fff; --frame: #171717; --edge: #343434; --camera: #555; --base-light: #d7d7d7; --base-dark: #a9a9a9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    .artboard { width: 1200px; height: 700px; padding: 28px 18px; display: flex; gap: 28px; align-items: center; overflow: hidden; }
    .computer { width: 906px; flex: none; }
    .lid { padding: 16px 10px 10px; background: var(--frame); border: 1px solid var(--edge); border-radius: 14px 14px 6px 6px; position: relative; }
    .camera { position: absolute; top: 6px; left: 50%; width: 4px; height: 4px; background: var(--camera); border-radius: 50%; }
    .desktop-screen { width: 100%; display: block; }
    .base { height: 12px; margin: 0 -12px; border-radius: 1px 1px 45% 45%; background: linear-gradient(var(--base-light),var(--base-dark)); border: 1px solid var(--base-dark); position: relative; }
    .base::before { content: ''; position: absolute; left: 43%; top: 0; width: 14%; height: 4px; border-radius: 0 0 4px 4px; background: var(--base-dark); }
    .phone { flex: none; width: 214px; background: var(--frame); border: 1px solid var(--edge); padding: 6px; border-radius: 32px; }
    .phone-screen { overflow: hidden; border-radius: 26px; position: relative; background: var(--paper); padding-top: 20px; }
    .phone-screen::before { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 64px; height: 12px; background: var(--frame); border-radius: 12px; }
    .mobile-screen { display: block; width: 100%; }
    .phone-screen::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 70px; height: 3px; border-radius: 8px; background: var(--frame); }
  </style>
</head>
<body>
  <main class="artboard" aria-label="Интерфейс приложения на компьютере и телефоне">
    <div class="computer"><div class="lid"><span class="camera" aria-hidden="true"></span><img class="desktop-screen" src="interface-desktop.png" alt="Планирование и результат расчёта на компьютере"></div><div class="base" aria-hidden="true"></div></div>
    <div class="phone"><div class="phone-screen"><img class="mobile-screen" src="interface-mobile-result.png" alt="Сводка результата на телефоне"></div></div>
  </main>
</body>
</html>
